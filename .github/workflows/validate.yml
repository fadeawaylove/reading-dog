name: Android validation
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to validate
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ''platforms;android-35'' ''build-tools;35.0.0'''
      - name: Check local e-ink policy and reflection bridge
        run: |
          mkdir -p "$RUNNER_TEMP/eink-checks"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/eink-checks" android-replica/src/com/example/yuejie/EInkSupport.java android-replica/tests/EInkChecks.java
          java -cp "$RUNNER_TEMP/eink-checks" com.example.yuejie.EInkChecks
      - name: Check version and build APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("android-replica/version.json"))["name"])')
          CODE=$(python3 -c 'import json; print(json.load(open("android-replica/version.json"))["code"])')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          OUT="$RUNNER_TEMP/reader-build"
          mkdir -p "$OUT/classes" "$OUT/dex"
          "$BT/aapt2" compile --dir android-replica/res -o "$OUT/res.zip"
          "$BT/aapt2" link -o "$OUT/unsigned.apk" -I "$ANDROID_JAR" --manifest android-replica/AndroidManifest.xml "$OUT/res.zip" -A android-replica/assets --min-sdk-version 24 --target-sdk-version 35 --version-code "$CODE" --version-name "$VERSION"
          find android-replica/src -name '*.java' > "$OUT/sources.txt"
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$ANDROID_JAR" -d "$OUT/classes" @"$OUT/sources.txt"
          jar cf "$OUT/classes.jar" -C "$OUT/classes" .
          "$BT/d8" --lib "$ANDROID_JAR" --output "$OUT/dex" "$OUT/classes.jar"
          jar uf "$OUT/unsigned.apk" -C "$OUT/dex" classes.dex
          "$BT/zipalign" -f 4 "$OUT/unsigned.apk" "$OUT/aligned.apk"
          "$BT/aapt2" dump badging "$OUT/aligned.apk" > "$OUT/badging.txt"
          head -1 "$OUT/badging.txt"
          unzip -t "$OUT/aligned.apk"
          echo 'Source, resources, DEX and APK packaging checks passed.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-assets/${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Verify and publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("android-replica/version.json"))["name"])')
          CODE=$(python3 -c 'import json; print(json.load(open("android-replica/version.json"))["code"])')
          test "$TAG" = "v$VERSION"
          cd android-replica/releases
          sha256sum -c SHA256SUMS.txt
          APK="reading-dog-$VERSION.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" | tee cert.txt
          grep -F '3d036c2956aa9369777eb0966aa61ea6c84870a2c87860cd8e8c020ff8990bb8' cert.txt
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -F "versionCode='$CODE' versionName='$VERSION'" badging.txt
          python3 -c 'from pathlib import Path; s=Path("../../RELEASE_NOTES.md").read_text(); Path("/tmp/release-notes.md").write_text(s.split("\n# ",1)[0])'
          gh release create "$TAG" "$APK" SHA256SUMS.txt --verify-tag --latest --title "阅读狗 $TAG" --notes-file /tmp/release-notes.md
          gh release download "$TAG" --pattern "$APK" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/published"
          (cd "$RUNNER_TEMP/published" && sha256sum -c SHA256SUMS.txt)
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets

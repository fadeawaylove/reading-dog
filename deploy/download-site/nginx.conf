user www-data;
worker_processes 1;
pid /run/reading-dog-download.pid;
error_log /var/log/reading-dog-download.error.log warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /var/log/reading-dog-download.access.log;
    sendfile on;
    server {
        listen 80;
        server_name magpie.fadeaway.ltd;
        root /srv/reading-dog-download;
        index index.html;
        autoindex off;
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;
        location / { return 404; }
        location /reading-dog/ {
            limit_except GET { deny all; }
            try_files $uri $uri/ =404;
        }
        location = /reading-dog/latest.json {
            limit_except GET { deny all; }
            add_header Cache-Control "no-cache, max-age=0" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }
        location ~ /\. { deny all; }
    }
}

  # BEGIN reading-dog-backend
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reader.fadeaway.ltd;
    ssl_certificate /etc/vpn-certs/current/fullchain.pem;
    ssl_certificate_key /etc/vpn-certs/current/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    location / { proxy_pass http://127.0.0.1:18082; }
  }
  # END reading-dog-backend

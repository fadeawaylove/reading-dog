name: reading-dog-backend
services:
  app:
    build: .
    image: reading-dog-backend:0.24
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:18082:3000"
    env_file: .env
    environment:
      DATA_DIR: /data
      ASSETS_DIR: /app/assets
      PUBLIC_ORIGIN: https://reader.fadeaway.ltd
    volumes:
      - ./data:/data
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
    healthcheck:
      test: [CMD, java, -cp, 'server.jar:lib/*', com.example.yuejie.HealthCheck]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
